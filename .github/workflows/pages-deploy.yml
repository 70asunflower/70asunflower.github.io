name: "Build and Deploy"
on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # submodules: true
          # If using the 'assets' git submodule from Chirpy Starter, uncomment above
          # (See: https://github.com/cotes2020/chirpy-starter/tree/main/assets)

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll b -d "_site${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: "production"

      # 必须在 HTML-Proofer 之前：否则 _site 里还没有 /pagefind/*，内链检查会挂
      - name: Build search index (Pagefind)
        run: npx -y pagefind@1.5.2 --site "_site${{ steps.pages.outputs.base_path }}"

      - name: Test site
        run: |
          bundle exec htmlproofer _site \
            \-\-disable-external \
            \-\-ignore-urls "/^http:\/\/127.0.0.1/,/^http:\/\/0.0.0.0/,/^http:\/\/localhost/"

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site${{ steps.pages.outputs.base_path }}"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # 部署成功后把全站 URL 推送给 IndexNow（Bing/Seznam/Yandex）
      # 失败不影响部署结果
      - name: Submit URLs to IndexNow
        if: success()
        continue-on-error: true
        env:
          KEY: db9ebaa23086dac0d0c982bab08d06bb
        run: |
          SITE="70asunflower.github.io"
          # 带随机参数绕过 CDN 边缘缓存，拿刚部署的最新 sitemap
          curl -sf --retry 3 "https://${SITE}/sitemap.xml?v=${GITHUB_RUN_ID}" -o sitemap.xml || { echo "sitemap fetch failed"; exit 0; }
          grep -oE '<loc>[^<]+</loc>' sitemap.xml | sed -E 's|</?loc>||g' | sed '/^$/d' > urls.txt
          COUNT=$(wc -l < urls.txt)
          echo "submitting ${COUNT} urls"
          jq -R -s 'split("\n") | map(select(length > 0)) | {host:"'"${SITE}"'", key:"'"${KEY}"'", keyLocation:"https://'"${SITE}"'/'"${KEY}"'.txt", urlList:.}' urls.txt > payload.json
          CODE=$(curl -s -o resp.txt -w "%{http_code}" -X POST \
            -H "Content-Type: application/json; charset=utf-8" \
            --retry 3 -d @payload.json "https://api.indexnow.org/indexnow")
          echo "IndexNow response: ${CODE}"
          cat resp.txt || true
