name: Sync Projects Data

# 每日拉取 _data/projects.yml 中仓库的 stars/pushed_at/language，
# 写入 _data/projects_stats.json 供 about 页渲染；数据变更自动触发站点重新部署。

on:
  schedule:
    - cron: "17 22 * * *" # 每天 UTC 22:17（北京时间次日 6:17）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: projects-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch repo stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/sync_projects.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/projects_stats.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore(data): update projects stats"
            git push
          fi
